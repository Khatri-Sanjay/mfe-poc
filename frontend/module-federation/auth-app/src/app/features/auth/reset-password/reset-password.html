<section class="auth-card">
  <p class="eyebrow">Account access</p>
  <h1>Reset password</h1>

  @if (errorMessage()) {
  <div class="alert alert-error">
    <i class="bi bi-exclamation-circle"></i>
    {{ errorMessage() }}
  </div>
  } @if (successMessage()) {
  <div class="alert alert-success">
    <i class="bi bi-check-circle"></i>
    {{ successMessage() }}
  </div>
  }

  @if (!successMessage()) {
  <form (submit)="onSubmit(); $event.preventDefault()">
    <label>
      New password
      <div class="input-group">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Min. 12 characters"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePasswordVisibility()"
        >
          <i [class]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
        </button>
      </div>
      @if (newPassword()) {
      <div class="password-hints">
        <span [class.valid]="newPassword().length >= 12">
          <i [class]="newPassword().length >= 12 ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Min. 12 characters
        </span>
        <span [class.valid]=" /[a-z]/.test(newPassword()) ">
          <i [class]=" /[a-z]/.test(newPassword()) ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Lowercase letter
        </span>
        <span [class.valid]=" /[A-Z]/.test(newPassword()) ">
          <i [class]=" /[A-Z]/.test(newPassword()) ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Uppercase letter
        </span>
        <span [class.valid]=" /\d/.test(newPassword()) ">
          <i [class]=" /\d/.test(newPassword()) ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Number
        </span>
      </div>
      }
    </label>

    <label>
      Confirm new password
      <input
        [type]="showPassword() ? 'text' : 'password'"
        placeholder="Repeat your password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        name="confirmPassword"
        autocomplete="new-password"
      />
      @if (confirmPassword() && !passwordsMatch()) {
      <span class="field-error">Passwords do not match</span>
      }
    </label>

    <button class="btn-primary" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
      <span class="spinner"></span>
      Resetting... } @else {
      Reset password
      }
    </button>
  </form>
  }

  <a class="auth-link-center" routerLink="/login">
    <i class="bi bi-arrow-left"></i> Back to sign in
  </a>
</section>
