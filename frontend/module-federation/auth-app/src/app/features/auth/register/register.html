<section class="auth-card">
  <p class="eyebrow">New customer</p>
  <h1>Create account</h1>

  @if (errorMessage()) {
  <div class="alert alert-error">
    <i class="bi bi-exclamation-circle"></i>
    {{ errorMessage() }}
  </div>
  }

  <form (submit)="onSubmit(); $event.preventDefault()">
    <div class="form-grid">
      <label>
        First name
        <input
          type="text"
          placeholder="John"
          [ngModel]="firstName()"
          (ngModelChange)="firstName.set($event)"
          name="firstName"
          autocomplete="given-name"
        />
      </label>

      <label>
        Last name
        <input
          type="text"
          placeholder="Doe"
          [ngModel]="lastName()"
          (ngModelChange)="lastName.set($event)"
          name="lastName"
          autocomplete="family-name"
        />
      </label>
    </div>

    <label>
      Email
      <input
        type="email"
        placeholder="john@example.com"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        autocomplete="email"
      />
    </label>

    <label>
      Phone <span class="optional">(optional)</span>
      <input
        type="tel"
        placeholder="+61400000000"
        [ngModel]="phone()"
        (ngModelChange)="phone.set($event)"
        name="phone"
        autocomplete="tel"
      />
    </label>

    <label>
      Password
      <div class="input-group">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Min. 12 characters"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePasswordVisibility()"
        >
          <i [class]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
        </button>
      </div>
      @if (password()) {
      <div class="password-hints">
        <span [class.valid]="password().length >= 12">
          <i [class]="password().length >= 12 ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Min. 12 characters
        </span>
        <span [class.valid]=" /[a-z]/.test(password()) ">
          <i [class]=" /[a-z]/.test(password()) ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Lowercase letter
        </span>
        <span [class.valid]=" /[A-Z]/.test(password()) ">
          <i [class]=" /[A-Z]/.test(password()) ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Uppercase letter
        </span>
        <span [class.valid]=" /\d/.test(password()) ">
          <i [class]=" /\d/.test(password()) ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
          Number
        </span>
      </div>
      }
    </label>

    <label>
      Confirm password
      <input
        [type]="showPassword() ? 'text' : 'password'"
        placeholder="Repeat your password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        name="confirmPassword"
        autocomplete="new-password"
      />
      @if (confirmPassword() && !passwordsMatch()) {
      <span class="field-error">Passwords do not match</span>
      }
    </label>

    <button class="btn-primary" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
      <span class="spinner"></span>
      Creating account... } @else {
      Create account
      }
    </button>
  </form>

  <a class="auth-link-center" routerLink="/login">Already have an account?</a>
</section>
