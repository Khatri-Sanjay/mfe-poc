services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-api-postgres
    environment:
      POSTGRES_DB: ecommerce_api
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_password
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecommerce_api_postgres_data:
